<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Portforlio" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karin's Portfolio</title>
    <link rel="icon" type="image/png" href="img/logo.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tilt+Neon&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Single+Day&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <script defer src="/assets/i18n.js"></script>
  <script src="/assets/main.js" defer></script>
  <body>
    <button class="fab-progress" aria-label="Scroll progress">
      <span class="fab-progress__pct">0%</span>
    </button>

    <!-- Header -->
    <header class="header" data-header>
      <div class="header__con">
        <a href="#home"><img src="/img/logo.png" alt="logo" /></a>

        <!-- Desktop nav -->
        <nav class="header__nav nav-desktop" aria-label="Primary">
          <ul>
            <li>
              <a
                class="header__menu__item active"
                href="#home"
                data-i18n="nav.home"
                >HOME</a
              >
            </li>
            <li>
              <a class="header__menu__item" href="#about" data-i18n="nav.about"
                >ABOUT</a
              >
            </li>
            <li>
              <a
                class="header__menu__item"
                href="#skills"
                data-i18n="nav.skills"
                >SKILLS</a
              >
            </li>
            <li>
              <a class="header__menu__item" href="#work" data-i18n="nav.works"
                >WORKS</a
              >
            </li>
            <li>
              <a
                class="header__menu__item"
                href="#contact"
                data-i18n="nav.contact"
                >CONTACT</a
              >
            </li>
          </ul>

          <!-- language toggle PC -->

          <nav class="lang-switch" role="group" aria-label="Language">
            <button class="lang-btn" data-lang="ja" data-i18n="ui.lang-ja">
              日本語
            </button>
            <button class="lang-btn" data-lang="en" data-i18n="ui.lang-en">
              English
            </button>
          </nav>
        </nav>

        <!-- Hamburger -->
        <button
          class="hamburger"
          aria-label="navigation menu toggle"
          aria-expanded="false"
          aria-controls="mobileNav"
          data-hamburger
        >
          <span class="hamburger-bar" aria-hidden="true"></span>
          <span class="sr-only">メニュー開く</span>
        </button>
      </div>
    </header>

    <!-- Mobile/Tablet dropdown nav -->
    <nav
      id="mobileNav"
      class="nav-mobile"
      aria-label="Mobile Primary"
      hidden
      data-mobile-nav
    >
      <ul>
        <li>
          <a class="header__menu__item" href="#home" data-i18n="nav.home"
            >HOME</a
          >
        </li>
        <li>
          <a class="header__menu__item" href="#about" data-i18n="nav.about"
            >ABOUT</a
          >
        </li>
        <li>
          <a class="header__menu__item" href="#skills" data-i18n="nav.skills"
            >SKILLS</a
          >
        </li>
        <li>
          <a class="header__menu__item" href="#work" data-i18n="nav.works"
            >WORKS</a
          >
        </li>
        <li>
          <a class="header__menu__item" href="#contact" data-i18n="nav.contact"
            >CONTACT</a
          >
        </li>
      </ul>
      <!-- language toggle MOBILE-->
      <div class="lang-switch is-mobile" role="group" aria-label="Language">
        <button class="lang-btn" data-lang="ja" data-i18n="ui.lang-ja">
          日本語
        </button>
        <button class="lang-btn" data-lang="en" data-i18n="ui.lang-en">
          English
        </button>
      </div>
    </nav>

    <!-- Home -->
    <section id="home" data-theme="dark">
      <div class="home__container">
        <!-- <img src="img/profile.jpg" alt="profile" class="home__avatar" /> -->
        <h1 class="home__title">
          Hello, <br class="view_sp" />
          I am <span class="auto_type neon"></span>
        </h1>
        <h2 class="home__description" data-i18n="home.catch"></h2>

        <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
        <script>
          var typed = new Typed(".auto_type", {
            strings: [" Web Designer", "Web Coder"],
            typeSpeed: 150,
            backSpeed: 150,
            loop: true,
          });
        </script>
      </div>
    </section>

    <!-- About -->

    <section id="about" class="about section" data-theme="light">
      <div class="section__container about__container">
        <!-- 프로필 이미지 -->
        <div class="about__img">
          <img src="img/profile.png" alt="プロフィール写真" />
        </div>

        <!-- 텍스트 블록 -->
        <div class="about__text">
          <span class="eyebrow">About</span>
          <h2 data-i18n="about.title" class="scroll-fade">About Me</h2>
          <p data-i18n="about.intro1" class="scroll-fade"></p>
          <p data-i18n="about.intro2" class="scroll-fade"></p>
          <p data-i18n="about.intro3" class="scroll-fade"></p>

          <!-- 키워드 태그 -->
          <ul class="about__tags scroll-fade">
            <li>#WebDesign</li>
            <li>#Coding</li>
            <li>#UIUX</li>
            <li>#WordPress</li>
          </ul>

          <!-- Works로 이동 CTA -->
          <a href="#work" class="btn-cta light">
            <span data-i18n="cta.seeWork"></span>
            <svg
              class="icon-arrow"
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="10 8 14 12 10 16"></polyline>
            </svg>
          </a>
        </div>
      </div>
    </section>

    <section id="skills" class="skill section" data-theme="dark">
      <div class="section__container skill__container">
        <span class="eyebrow">Skillset</span>
        <h2 data-i18n="skills.title" class="scroll-fade"></h2>
        <p data-i18n="skills.intro" class="sub scroll-fade"></p>
        <div class="bubble-field" id="bubbleField" aria-hidden="true"></div>
      </div>
    </section>
  </body>
</html>
